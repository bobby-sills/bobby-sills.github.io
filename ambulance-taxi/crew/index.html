<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // This build is meant to be seen inside the phone frame on crew.html;
    // opened on its own, go there instead of showing it full screen.
    if (window.top === window.self) location.replace(new URL("../crew.html", location.href));
  </script>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="/ambulance-taxi/crew/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Take calls, navigate and hand over at the ER — clickable demo of the ambulance crew app.">
  <meta name="theme-color" content="#157A47">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Crew">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Ambulance Taxi · Crew</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F5F4F1; }
    /* Shown until Flutter draws its first frame. */
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 88px; height: 88px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(0.9); opacity: 0.7; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
